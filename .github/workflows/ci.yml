# LogRaven — Phase 1 quality gates
name: CI

on:
  push:
    branches: [main, improvement]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend lint, format, unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libfontconfig1 libglib2.0-0

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Ruff lint
        run: ruff check app tests integration_tests

      - name: Ruff format check
        run: ruff format --check integration_tests

      - name: Unit tests
        run: pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=40

  backend-integration:
    name: Backend migrations + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lograven_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lograven_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lograven_test
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lograven_test
      REDIS_URL: redis://127.0.0.1:6379/0
      INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters
      LOGRAVEN_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Upgrade to pre-018 schema
        run: alembic upgrade 017

      - name: Seed representative pre-018 data
        run: python integration_tests/migration_018_probe.py seed

      - name: Upgrade migration 018
        run: alembic upgrade 018

      - name: Verify migration 018 data preservation
        run: python integration_tests/migration_018_probe.py verify

      - name: Seed representative pre-019 data
        run: python integration_tests/migration_019_probe.py seed

      - name: Upgrade migrations
        run: alembic upgrade head

      - name: Verify migration 019 backfill and preservation
        run: python integration_tests/migration_019_probe.py verify-upgrade

      - name: Downgrade migration 019
        run: alembic downgrade 018

      - name: Verify migration 019 downgrade
        run: python integration_tests/migration_019_probe.py verify-downgrade

      - name: Re-upgrade migrations
        run: alembic upgrade head

      - name: Check model and migration parity
        run: alembic check

      - name: Integration tests
        run: pytest integration_tests/ -q -m integration

      - name: Downgrade migrations
        run: alembic downgrade base

      - name: Re-upgrade migrations
        run: alembic upgrade head

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Typecheck tests and config
        run: npm run typecheck:tests

      - name: Typecheck and build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

  frontend-e2e:
    name: Frontend Chromium smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  docker:
    name: Production images build
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend, frontend-e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod backend/

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile frontend/
