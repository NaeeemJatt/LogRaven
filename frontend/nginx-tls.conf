# LogRaven — nginx: static SPA + API reverse proxy with TLS termination.
#
# Used by docker-compose.tls.yml. Expects Let's Encrypt certificates issued
# with a fixed lineage name so the config never needs domain templating:
#   sudo certbot certonly --standalone --cert-name lograven -d yourdomain.com
# /etc/letsencrypt is mounted read-only into the container.

server {
    listen 80;
    server_name _;

    # ACME HTTP-01 renewals pass through; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/lograven/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lograven/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Large log uploads go through to the API (tier max is 200 MB)
    client_max_body_size 210m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── API reverse proxy ────────────────────────────────────────────────
    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Static SPA ───────────────────────────────────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
