<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background / Shield Gradients -->
    <linearGradient id="shieldBg" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151A26"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ravenBeak" x1="60" y1="50" x2="108" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="wingPlates" x1="20" y1="30" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A344A"/>
      <stop offset="60%" stop-color="#1A2234"/>
      <stop offset="100%" stop-color="#0E1422"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="62" cy="52" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Cyber Shield Contour -->
  <path d="M 64,10 L 106,26 L 106,68 Q 106,98 64,118 Q 22,98 22,68 L 22,26 Z" 
        fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Subtle Inner Grid / Telemetry Rim -->
  <path d="M 64,18 L 98,31 L 98,66 Q 98,90 64,108 Q 30,90 30,66 L 30,31 Z" 
        fill="none" stroke="#2A344A" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Left Wing Armor Facets (Cyber Plating) -->
  <!-- Upper Feather Plating -->
  <path d="M 33,36 L 54,44 L 46,60 L 32,54 Z" fill="url(#wingPlates)" stroke="#384766" stroke-width="1"/>
  <!-- Middle Feather Plating -->
  <path d="M 32,58 L 52,66 L 44,82 L 34,74 Z" fill="url(#wingPlates)" stroke="#384766" stroke-width="1"/>
  <!-- Lower Feather Plating -->
  <path d="M 36,80 L 52,86 L 64,104 Q 48,94 36,80 Z" fill="url(#wingPlates)" stroke="#384766" stroke-width="1"/>

  <!-- Raven Head Silhouette & Crown (Sleek Obsidian Geometry) -->
  <path d="M 46,30 L 64,20 L 76,28 L 84,38 L 74,44 L 88,48 L 72,56 L 60,48 L 52,38 Z" 
        fill="#1E273A" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Raven Brow & Beak (Sharp predatory golden spear) -->
  <path d="M 66,48 L 104,66 L 70,78 L 62,64 Z" 
        fill="url(#ravenBeak)" stroke="#FDE047" stroke-width="1.2" stroke-linejoin="round" filter="url(#cyberGlow)"/>

  <!-- Lower Jaw / Neck Cut -->
  <path d="M 70,78 L 82,72 L 64,88 L 54,76 L 62,64 Z" 
        fill="#B45309" stroke="#D97706" stroke-width="1"/>

  <!-- Cybernetic Eye / Telemetry Sensor (Glowing Amber Beacon) -->
  <circle cx="63" cy="52" r="9" fill="url(#eyeGlow)"/>
  <circle cx="63" cy="52" r="4" fill="#FEF08A"/>
  <polygon points="63,47 67,52 63,57 59,52" fill="#F59E0B"/>
  <circle cx="64" cy="51" r="1.5" fill="#FFFFFF"/>

  <!-- Tactical Energy Core Line (Spine) -->
  <path d="M 64,88 L 64,106" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="64" cy="94" r="2" fill="#FEF08A"/>
</svg>