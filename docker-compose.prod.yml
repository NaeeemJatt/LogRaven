# LogRaven — Production Docker Compose (single-host, e.g. one EC2 instance)
#
# Services: nginx+frontend (web), API, Celery worker, Celery beat,
# PostgreSQL, Redis. Sized for a small instance (1 GB RAM + swap).
#
# Usage:
#   cp .env.production.example .env   # fill in secrets first
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["api"]
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/lograven
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/data
      - USE_ASYNCIO_INVESTIGATION_PIPELINE=false
      - AUTO_START_DEV_WORKER=false
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_FORWARDED_FOR=true
      - LOG_FORMAT=json
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/lograven
      - REDIS_URL=redis://redis:6379
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/data
      - USE_ASYNCIO_INVESTIGATION_PIPELINE=false
      - AUTO_START_DEV_WORKER=false
      - LOG_FORMAT=json
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-1}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["beat"]
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/lograven
      - REDIS_URL=redis://redis:6379
      - LOG_FORMAT=json
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=lograven
      - POSTGRES_USER=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lograven"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Never expose 5432 publicly; containers reach it on the internal network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # volatile-lru only evicts TTL'd keys (refresh tokens, task results) —
    # never Celery queue entries, which have no TTL.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  appdata:
