# Editable install: from this folder run  pip install -e .
# Then `import app` works from any cwd (fixes uvicorn from backend\backend, etc.).
# Dev deps stay in requirements.txt — this only registers the package.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lograven-backend"
version = "1.0.0"
requires-python = ">=3.11"
description = "LogRaven FastAPI backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Existing style debt stays out of Phase 1; enforce syntax/runtime-critical rules repo-wide.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
