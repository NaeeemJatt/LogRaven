rules:
- rule_id: QUALYS-AWS-CID-1
  cid: '1'
  title: Ensure multi-factor authentication (MFA) is enabled for all IAM users that
    have a console password
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: CRITICAL
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.mfa_active
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: &id001
  - Federal Risk and Authorization Management Program (FedRAMP LI-SaaS) - LI-SaaS
    Security Baseline
  - The Network and Information Systems (NIS 2 Directive) (EU) 2022/2555
  - Payment Card Industry Data Security Standard (PCI-DSS) v4.0
  - NESA UAE Information Assurance Standards (IAS)
  - Criminal Justice Information Services (CJIS) Security Policy
  - New Zealand Information Security Manual (NZISM)
  - 'Sarbanes-Oxley Act: IT Security'
  - Federal Risk and Authorization Management Program (FedRAMP H) - High Security
    Baseline
  - 'APRA Prudential Practice Guide (PPG): CPG 234 - Management of Security Risk in
    Information and Information Technology'
  - Technology Risk Management (TRM) Guidelines
  - Federal Risk and Authorization Management Program (FedRAMP M) - Moderate Security
    Baseline
  - Federal Risk and Authorization Management Program (FedRAMP L) - Low Security Baseline
  - Microsoft Cloud Security Benchmark
  - IRS Publication 1075
  - SWIFT Customer Security Controls Framework - Customer Security Programme v2024
  - Cloud Controls Matrix (CCM)
  - IRDAI Guidelines On Information and Cyber Security for Insurers
  - General Data Protection Regulation (GDPR)
  - CIS Controls Version 8
  - US Gramm Leach Bliley Act (GLBA)
  - NERC Critical Infrastructure Protection (CIP)
  - NCSC Basic Cyber Security Controls (BCSC)
  - CIS Controls Version 8.1
  - The NIST Cybersecurity Framework (CSF)
  - 'Monetary Authority of Singapore (MAS) - Notice 834: Cyber Hygiene Practices'
  - ANSSI 40 Essential Measures for a Healthy Network
  - NIST 800-53 (Special Publication)
  - Australian Signals Directorate Information Security Manual (ISM)
  - NIST Special Publication 800-171
  - 2017 Trust Services Criteria for Security, Availability, Processing Integrity,
    Confidentiality, and Privacy (SOC 2)
  - US Cybersecurity Maturity Model Certification (CMMC) 2.0 Level 2
  - Minimum Acceptable Risk Standards for Exchanges (MARS-E)
  - Reserve Bank of India (RBI) - Baseline Cyber Security and Resilience Requirements
    (Annex 1)
  - The Australian Signals Directorate - The Essential 8 Strategies (ASD 8)
  - Health Insurance Portability and Accountability (HIPAA) Security Rule 45 CFR Parts
    160/164, Subparts A/C:1996
  - ISO/IEC 27001:2022
  - US Cybersecurity Maturity Model Certification (CMMC) 2.0 Level 1
  - California Consumer Privacy Act of 2018 (SB-1121)
- rule_id: QUALYS-AWS-CID-2
  cid: '2'
  title: Ensure console credentials unused for 45 days or greater are disabled
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.last_rotated_or_used
    operator: age_days_gte
    value: 45
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-3
  cid: '3'
  title: Ensure access keys unused for 90 days or greater are disabled
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.last_rotated_or_used
    operator: age_days_gte
    value: 90
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-4
  cid: '4'
  title: Ensure access key 1 is rotated every 90 days or less
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.last_rotated_or_used
    operator: age_days_gte
    value: 90
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-5
  cid: '5'
  title: Ensure access key 2 is rotated every 90 days or less
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.last_rotated_or_used
    operator: age_days_gte
    value: 90
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-6
  cid: '6'
  title: Ensure that custom IAM Password Policy is Defined
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicyDefined
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-7
  cid: '7'
  title: Ensure that custom IAM password policy requires at least one uppercase letter
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicy.RequireUppercaseCharacters
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-8
  cid: '8'
  title: Ensure that custom IAM password policy requires at least one lowercase letter
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicy.RequireLowercaseCharacters
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-9
  cid: '9'
  title: Ensure that custom IAM password policy requires at least one symbol
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicy.RequireSymbols
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-10
  cid: '10'
  title: Ensure that custom IAM password policy requires at least one number
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicy.RequireNumbers
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-11
  cid: '11'
  title: Ensure that custom IAM password policy requires minimum length of 14 or greater
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicy.MinimumPasswordLength
    operator: lte
    value: 14
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-12
  cid: '12'
  title: Ensure that custom IAM password policy prevents password reuse
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicy.PasswordReusePrevention
    operator: lte
    value: 24
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-13
  cid: '13'
  title: Ensure that custom IAM password policy expires passwords within 90 days or
    less
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PasswordPolicy.MaxPasswordAge
    operator: gte
    value: 90
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-14
  cid: '14'
  title: Ensure no root user account access key exists
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: CRITICAL
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.AccountAccessKeysPresent
    operator: eq
    value: true
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-15
  cid: '15'
  title: Ensure multi-factor authentication (MFA) is enabled for the root user account
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: CRITICAL
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.userIdentity.type
    operator: eq
    value: Root
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-17
  cid: '17'
  title: Ensure IAM policies are attached only to groups or roles
  provider: AWS
  service: IAM
  execution_type: Build & Run Time
  criticality: MEDIUM
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.UserPolicyList
    operator: neq
    value: []
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-18
  cid: '18'
  title: Eliminate use of the root user for administrative and daily tasks
  provider: AWS
  service: IAM
  execution_type: Run Time
  criticality: CRITICAL
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.userIdentity.type
    operator: eq
    value: Root
  - field_path: $.eventType
    operator: neq
    value: AwsServiceEvent
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-19
  cid: '19'
  title: Ensure CloudTrail is enabled in all regions
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.LoggingEnabled
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-20
  cid: '20'
  title: Ensure CloudTrail log file validation is enabled
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.LogFileValidationEnabled
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-21
  cid: '21'
  title: Ensure the S3 bucket used to store CloudTrail logs is not publicly accessible
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: CRITICAL
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.PubliclyAccessible
    operator: eq
    value: true
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-22
  cid: '22'
  title: Ensure CloudTrail trails are integrated with CloudWatch Logs
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.CloudWatchLogsLogGroupArn
    operator: exists
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-23
  cid: '23'
  title: Ensure AWS Config is enabled in all regions
  provider: AWS
  service: CONFIG
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.controls.cid_23_compliant
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-24
  cid: '24'
  title: Ensure S3 bucket access logging is enabled on the CloudTrail S3 bucket
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $.LoggingEnabled
    operator: eq
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-25
  cid: '25'
  title: Ensure CloudTrail logs are encrypted at rest using KMS CMKs
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $
    operator: kms_cmk_encrypted
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-26
  cid: '26'
  title: Ensure rotation for customer created symmetric CMKs is enabled
  provider: AWS
  service: KMS
  execution_type: Build & Run Time
  criticality: MEDIUM
  target_source: aws_config_state
  match_logic: ALL
  conditions:
  - field_path: $
    operator: kms_cmk_encrypted
    value: false
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - AWS Infrastructure as Code Security Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-27
  cid: '27'
  title: Ensure unauthorized API calls are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.errorCode
    operator: in
    value:
    - AccessDenied
    - Client.UnauthorizedOperation
    - UnauthorizedOperation
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-28
  cid: '28'
  title: Ensure management console sign-in without multi-factor authentication (MFA)
    is monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: CRITICAL
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventName
    operator: eq
    value: ConsoleLogin
  - field_path: $.additionalEventData.MFAUsed
    operator: neq
    value: 'Yes'
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-29
  cid: '29'
  title: Ensure usage of root account is monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: CRITICAL
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.userIdentity.type
    operator: eq
    value: Root
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-30
  cid: '30'
  title: Ensure IAM policy changes are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventSource
    operator: eq
    value: iam.amazonaws.com
  - field_path: $.eventName
    operator: in
    value:
    - DeleteGroupPolicy
    - DeleteRolePolicy
    - DeleteUserPolicy
    - PutGroupPolicy
    - PutRolePolicy
    - PutUserPolicy
    - CreatePolicy
    - DeletePolicy
    - CreatePolicyVersion
    - DeletePolicyVersion
    - AttachRolePolicy
    - DetachRolePolicy
    - AttachUserPolicy
    - DetachUserPolicy
    - AttachGroupPolicy
    - DetachGroupPolicy
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-31
  cid: '31'
  title: Ensure CloudTrail configuration changes are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventSource
    operator: eq
    value: cloudtrail.amazonaws.com
  - field_path: $.eventName
    operator: in
    value:
    - CreateTrail
    - UpdateTrail
    - DeleteTrail
    - StartLogging
    - StopLogging
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-32
  cid: '32'
  title: Ensure AWS Management Console authentication failures are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: MEDIUM
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventName
    operator: eq
    value: ConsoleLogin
  - field_path: $.responseElements.ConsoleLogin
    operator: eq
    value: Failure
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-33
  cid: '33'
  title: Ensure disabling or scheduled deletion of customer created Customer Managed
    Key (CMK) is monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: MEDIUM
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventSource
    operator: eq
    value: kms.amazonaws.com
  - field_path: $.eventName
    operator: in
    value:
    - DisableKey
    - ScheduleKeyDeletion
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-34
  cid: '34'
  title: Ensure S3 bucket policy changes are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventSource
    operator: eq
    value: s3.amazonaws.com
  - field_path: $.eventName
    operator: in
    value:
    - PutBucketAcl
    - PutBucketPolicy
    - PutBucketCors
    - PutBucketLifecycle
    - PutBucketReplication
    - DeleteBucketPolicy
    - DeleteBucketCors
    - DeleteBucketLifecycle
    - DeleteBucketReplication
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-35
  cid: '35'
  title: Ensure AWS Config configuration changes are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: MEDIUM
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventSource
    operator: eq
    value: config.amazonaws.com
  - field_path: $.eventName
    operator: in
    value:
    - StopConfigurationRecorder
    - DeleteDeliveryChannel
    - PutDeliveryChannel
    - PutConfigurationRecorder
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-36
  cid: '36'
  title: Ensure security group changes are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: MEDIUM
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventName
    operator: in
    value:
    - AuthorizeSecurityGroupIngress
    - AuthorizeSecurityGroupEgress
    - RevokeSecurityGroupIngress
    - RevokeSecurityGroupEgress
    - CreateSecurityGroup
    - DeleteSecurityGroup
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-37
  cid: '37'
  title: Ensure Network Access Control Lists (NACL) changes are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: MEDIUM
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventName
    operator: in
    value:
    - CreateNetworkAcl
    - CreateNetworkAclEntry
    - DeleteNetworkAcl
    - DeleteNetworkAclEntry
    - ReplaceNetworkAclEntry
    - ReplaceNetworkAclAssociation
  policies:
  - AWS Best Practices Policy
  - AWS Identity Access Management Best Practices Policy
  - CIS Amazon Web Services Foundations Benchmark
  mandates: *id001
- rule_id: QUALYS-AWS-CID-38
  cid: '38'
  title: Ensure changes to network gateways are monitored
  provider: AWS
  service: CLOUD_TRAIL
  execution_type: Run Time
  criticality: HIGH
  target_source: aws_cloudtrail_log
  match_logic: ALL
  conditions:
  - field_path: $.eventName
    operator: in
    value:
    - CreateCustomerGateway
    - DeleteCustomerGateway
    - AttachInternetGateway
    - CreateInternetGateway
