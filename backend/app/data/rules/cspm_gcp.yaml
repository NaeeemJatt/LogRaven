  - GCP Infrastructure as Code Security Best Practices Policy
  mandates: *id001
- rule_id: QUALYS-GCP-CID-52004
  cid: '52004'
  title: Ensure user-managed/external keys for service accounts are rotated every
    90 days or less
  provider: GCP
  service: IAM
  execution_type: Run Time
  criticality: HIGH
  target_source: gcp_asset_inventory
  match_logic: ALL
  conditions:
  - field_path: $.apiKeyAgeDays
    operator: age_days_gte
    value: 90
  policies:
  - CIS Google Cloud Platform Foundation Benchmark
  - GCP Best Practices Policy
  mandates: *id001
- rule_id: QUALYS-GCP-CID-52005
  cid: '52005'
  title: Ensure KMS encryption keys are rotated within a period of 90 days
  provider: GCP
  service: IAM
  execution_type: Build & Run Time
  criticality: HIGH
  target_source: gcp_asset_inventory
  match_logic: ALL
  conditions:
  - field_path: $.databaseEncryption.state
    operator: neq
    value: ENCRYPTED
  policies:
  - CIS Google Cloud Platform Foundation Benchmark
  - GCP Best Practices Policy
  - GCP Infrastructure as Code Security Best Practices Policy
  mandates: *id001
