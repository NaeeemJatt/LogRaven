services:
  db:
    image: postgres:16-alpine
    container_name: lograven_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - lograven_net

  redis:
    image: redis:7-alpine
    container_name: lograven_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lograven_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lograven_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - lograven_storage:/app/storage
    expose:
      - "8000"
    networks:
      lograven_net:
        aliases:
          - api
          - backend

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lograven_celery
    restart: unless-stopped
    command: worker
    healthcheck:
      disable: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - lograven_storage:/app/storage
    networks:
      - lograven_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lograven_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - api
    networks:
      - lograven_net

volumes:
  postgres_data:
  redis_data:
  lograven_storage:

networks:
  lograven_net:
    driver: bridge
