# LogRaven — Example Docker Compose (optional local stack)

version: '3.9'

services:
  lograven:
    image: lograven:v1.0
    container_name: lograven-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:lgrpass@lograven-db:5432/lograven
      - REDIS_URL=redis://lograven-redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STORAGE_BACKEND=local
      - JWT_SECRET_KEY=${JWT_SECRET_KEY?JWT_SECRET_KEY is required}
      - AUTO_START_DEV_WORKER=false
      - USE_ASYNCIO_INVESTIGATION_PIPELINE=false
    volumes:
      - ./data/uploads:/app/local/uploads
      - ./data/reports:/app/local/reports
    depends_on:
      - lograven-db
      - lograven-redis

  lograven-worker:
    image: lograven:v1.0
    container_name: lograven-worker
    command: celery -A app.tasks.process_investigation worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:lgrpass@lograven-db:5432/lograven
      - REDIS_URL=redis://lograven-redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STORAGE_BACKEND=local
      - JWT_SECRET_KEY=${JWT_SECRET_KEY?JWT_SECRET_KEY is required}
    volumes:
      - ./data/uploads:/app/local/uploads
      - ./data/reports:/app/local/reports
    depends_on:
      - lograven-db
      - lograven-redis

  lograven-db:
    image: postgres:15-alpine
    container_name: lograven-db
    environment:
      - POSTGRES_PASSWORD=lgrpass
      - POSTGRES_DB=lograven
    volumes:
      - lograven_data:/var/lib/postgresql/data

  lograven-redis:
    image: redis:7-alpine
    container_name: lograven-redis

volumes:
  lograven_data:
